name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate add-on
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate add-on metadata
        run: python scripts/validate_addon.py

      - name: Check Bash syntax
        run: |
          bash -n maintenance_window/rootfs/usr/lib/maintenance-window/scheduler.sh
          bash -n maintenance_window/run.sh
          bash -n maintenance_window/rootfs/etc/s6-overlay/s6-rc.d/maintenance_window/run
          bash -n maintenance_window/rootfs/etc/s6-overlay/s6-rc.d/maintenance_window/finish
          bash -n maintenance_window/rootfs/etc/s6-overlay/s6-rc.d/maintenance_window_health/run
          bash -n scripts/test_scheduler_restore.sh

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor jq shellcheck

      - name: Run ShellCheck
        run: |
          shellcheck -e SC1091,SC2154 \
            maintenance_window/rootfs/usr/lib/maintenance-window/scheduler.sh \
            maintenance_window/run.sh \
            maintenance_window/rootfs/etc/s6-overlay/s6-rc.d/maintenance_window/run \
            maintenance_window/rootfs/etc/s6-overlay/s6-rc.d/maintenance_window/finish \
            maintenance_window/rootfs/etc/s6-overlay/s6-rc.d/maintenance_window_health/run \
            scripts/test_scheduler_restore.sh

      - name: Test scheduler restore recovery
        run: bash scripts/test_scheduler_restore.sh

      - name: Validate AppArmor profile
        run: |
          if [ -f maintenance_window/apparmor.txt ]; then
            apparmor_parser --preprocess maintenance_window/apparmor.txt >/dev/null
          fi

      - name: Build add-on image
        run: |
          docker build \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg BUILD_DESCRIPTION="Maintenance Window" \
            --build-arg BUILD_NAME="Maintenance Window" \
            --build-arg BUILD_REF="${GITHUB_SHA}" \
            --build-arg BUILD_REPOSITORY="${GITHUB_REPOSITORY}" \
            --build-arg BUILD_VERSION="$(python -c 'import json; print(json.load(open("maintenance_window/config.json"))["version"])')" \
            --tag maintenance-window-addon:test \
            maintenance_window

      - name: Smoke-test watchdog endpoint
        run: |
          data_dir="$(mktemp -d)"
          container_name="maintenance-window-smoke"

          trap 'docker rm --force "${container_name}" >/dev/null 2>&1 || true; rm -rf "${data_dir}"' EXIT

          cat > "${data_dir}/options.json" <<'JSON'
          {
            "log_level": "info",
            "dry_run": true,
            "restart_core": false,
            "core_stop_confirmation": "",
            "startup_grace_seconds": 300,
            "max_core_stop_minutes": 60,
            "min_available_memory_mb": 256,
            "core_start_timeout_seconds": 600,
            "restore_stagger_seconds": 15,
            "pause_core_watchdog": false,
            "list_addons_on_startup": false,
            "never_stop_addons": [],
            "stop_addons": [],
            "start_addons": [],
            "windows": []
          }
          JSON

          docker run --detach \
            --name "${container_name}" \
            --env SUPERVISOR_TOKEN=test-token \
            --publish 127.0.0.1:18099:8099 \
            --volume "${data_dir}:/data" \
            maintenance-window-addon:test

          for _ in {1..30}; do
            if response="$(curl --fail --silent http://127.0.0.1:18099/health)" \
              && [[ "${response}" == "ok" ]]; then
              exit 0
            fi
            sleep 1
          done

          docker logs "${container_name}"
          exit 1