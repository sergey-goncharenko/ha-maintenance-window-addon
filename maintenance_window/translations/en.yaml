configuration:
  log_level:
    name: Log level
    description: >-
      Controls how much detail the app writes to its log. Use debug or trace
      while testing your schedule, info for normal operation.
  dry_run:
    name: Dry run
    description: >-
      When enabled, the app only logs what it would do and never actually
      stops or starts Home Assistant Core or any app. Great for validating a
      schedule safely.
  restart_core:
    name: Default Core stop/restart
    description: >-
      Default used by windows that do not set their own Core action. When
      enabled, Home Assistant Core is stopped at the start of the window and
      started again at the end. Disable to only cycle the selected apps.
  core_stop_confirmation:
    name: Core stop confirmation
    description: >-
      Extra arming value required before Home Assistant Core may be stopped. Set
      exactly to STOP_CORE after testing with dry run. Leave empty to prevent
      Core from being stopped even if Stop & restart Home Assistant Core is on.
  startup_grace_seconds:
    name: Startup grace period
    description: >-
      Number of seconds after this app starts during which Home Assistant Core
      may not be stopped. This helps prevent lockout from an accidental schedule
      immediately after boot or app restart.
  max_core_stop_minutes:
    name: Maximum Core stop duration
    description: >-
      Maximum maintenance window duration that is allowed to stop Home Assistant
      Core. Longer windows can still start/stop apps, but Core stays running.
  core_start_timeout_seconds:
    name: Core start readiness timeout
    description: >-
      Number of seconds to wait for the Home Assistant Core API to respond after
      starting Core. This keeps the restore phase open while Core is still
      booting or being restarted by Supervisor health checks.
  pause_core_watchdog:
    name: Pause Core watchdog during windows
    description: >-
      Temporarily disables the Home Assistant Core watchdog while Maintenance
      Window intentionally stops and starts Core, then restores the previous
      watchdog setting after Core is restored.
  list_addons_on_startup:
    name: List installed apps on startup
    description: >-
      When enabled, writes a copyable Supervisor app inventory to the app config
      folder and logs each app slug. This helps fill stop/start lists.
  stop_addons:
    name: Default apps to stop
    description: >-
      Default list used by windows that do not set their own stop list. Apps
      are started again when the window ends. Leave empty to only affect Core.
  start_addons:
    name: Default apps to start temporarily
    description: >-
      Default list used by windows that do not set their own start list. Apps
      already running are left running; apps started by this scheduler are
      stopped again when the window ends.
  windows:
    name: Maintenance windows
    description: >-
      One or more scheduled windows describing when Core/apps should be
      stopped and for how long.
    fields:
      name:
        name: Window name
        description: A friendly label shown in the app log.
      start_time:
        name: Start time
        description: 24-hour local time (HH:MM) when the window begins.
      duration_minutes:
        name: Duration (minutes)
        description: How long Core and the selected apps stay stopped (1-1440).
      restart_core:
        name: Stop & restart Home Assistant Core
        description: >-
          Optional per-window override. Use this when one window should stop Core
          and another should not.
      stop_addons:
        name: Apps to stop
        description: >-
          Optional per-window override. Use this when one window should stop a
          different app set than the defaults.
      start_addons:
        name: Apps to start temporarily
        description: >-
          Optional per-window override. Use this to open SSH or another app
          during this window, even while Core is down.
      days:
        name: Days
        description: >-
          Days of the week this window runs (mon through sun). Leave empty to
          run every day.
