configuration:
  log_level:
    name: Log level
    description: >-
      Controls how much detail the add-on writes to its log. Use debug or trace
      while testing your schedule, info for normal operation.
  dry_run:
    name: Dry run
    description: >-
      When enabled, the add-on only logs what it would do and never actually
      stops or starts Home Assistant Core or any add-on. Great for validating a
      schedule safely.
  restart_core:
    name: Stop & restart Home Assistant Core
    description: >-
      When enabled, Home Assistant Core is stopped at the start of the window and
      started again at the end. Disable to only cycle the selected add-ons.
  core_stop_confirmation:
    name: Core stop confirmation
    description: >-
      Extra arming value required before Home Assistant Core may be stopped. Set
      exactly to STOP_CORE after testing with dry run. Leave empty to prevent
      Core from being stopped even if Stop & restart Home Assistant Core is on.
  startup_grace_seconds:
    name: Startup grace period
    description: >-
      Number of seconds after this add-on starts during which Home Assistant Core
      may not be stopped. This helps prevent lockout from an accidental schedule
      immediately after boot or add-on restart.
  max_core_stop_minutes:
    name: Maximum Core stop duration
    description: >-
      Maximum maintenance window duration that is allowed to stop Home Assistant
      Core. Longer windows can still start/stop add-ons, but Core stays running.
  stop_addons:
    name: Add-ons to stop
    description: >-
      List of add-on slugs to stop during the maintenance window (e.g.
      core_mosquitto). They are started again when the window ends. Leave empty
      to only affect Core.
  start_addons:
    name: Add-ons to start temporarily
    description: >-
      List of add-on slugs to start at the beginning of the maintenance window.
      Add-ons that were already running are left running; add-ons started by this
      scheduler are stopped again when the window ends.
  windows:
    name: Maintenance windows
    description: >-
      One or more scheduled windows describing when Core/add-ons should be
      stopped and for how long.
    fields:
      name:
        name: Window name
        description: A friendly label shown in the add-on log.
      start_time:
        name: Start time
        description: 24-hour local time (HH:MM) when the window begins.
      duration_minutes:
        name: Duration (minutes)
        description: How long Core and the selected add-ons stay stopped (1-1440).
      restart_core:
        name: Stop & restart Home Assistant Core
        description: >-
          Optional per-window override. When omitted, the global Stop & restart
          Home Assistant Core setting is used.
      stop_addons:
        name: Add-ons to stop
        description: >-
          Optional per-window override. When omitted, the global Add-ons to stop
          list is used.
      start_addons:
        name: Add-ons to start temporarily
        description: >-
          Optional per-window override. When omitted, the global Add-ons to start
          temporarily list is used.
      days:
        name: Days
        description: Days of the week this window runs (mon through sun).
